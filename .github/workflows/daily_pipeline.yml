name: Daily MF Advisor Pipeline

on:
  schedule:
    # Runs at 2:00 AM UTC (7:30 AM IST) every day. You can adjust this.
    # python -m app.doc_extractor and  python -m app.doc_extractor are run locally once every 1 month
    - cron: '0 2 * * *'
  workflow_dispatch: # This line gives you a "Run Workflow" button in GitHub to test it manually!

jobs:
  run-daily-scripts:
    runs-on: ubuntu-latest

    # 1. ADD THIS PERMISSIONS BLOCK:
    permissions:
      contents: 'read'
      id-token: 'write' # This is required for Workload Identity Federation
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip' # Speeds up daily runs by caching libraries

          # 2. REPLACE YOUR AUTH STEP WITH THIS ONE:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          audience: 'https://github.com/Thirumal255'
          # Replace YOUR_PROJECT_NUMBER with your actual 12-digit project number
          workload_identity_provider: 'projects/264866286943/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider'
          
          # Replace YOUR_PROJECT_ID with your actual project ID
          service_account: 'mf-advisor-pipeline-automation@mf-advisor-487108.iam.gserviceaccount.com'

      # 🟢 REPLACE THE FAILED PROXY STEP WITH THIS:
      - name: Start Cloud SQL Auth Proxy
        run: |
          # Download the official Google Cloud SQL Proxy v2
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          
          # Start the proxy in the background (&) on port 5432
          # ⚠️ Replace the string below with your exact Cloud SQL Connection Name!
          ./cloud-sql-proxy mf-advisor-487108:asia-south1:mf-advisor-db --port 5432 > proxy.log 2>&1 &
          
          # Wait a few seconds for the secure tunnel to fully open before continuing
          sleep 3

          cat proxy.log

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Processing Scripts
        run: |
          python -m app.get_scheme_details full
          python -m app.build_parent_masterlist
          python -m app.build_parent_nav_dataset
          python -m app.build_all_scheme_metrics
          python -m app.merge_all_data
          python -m app.run_scoring

      - name: Prepare Backend Data
        run: |
          mkdir -p backend/data
          cp data/scheme_metrics_merged.json backend/data/scheme_metrics_merged.json
          cp data/parent_scheme_nav.json backend/data/parent_scheme_nav.json

      # The DB scripts will need access to your Postgres credentials via environment variables
      - name: Update Google Cloud & Postgres DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python -m backend.build_and_upload_index
          python -m backend.convert_to_postgres
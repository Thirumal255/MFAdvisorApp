name: 📱 Build Android App (EAS)

# The workflow_dispatch trigger means this ONLY runs when you click the button in GitHub
on:
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # You can change this if you use Node 20 locally
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Build Android Preview
        # Uses your exact local command, plus --non-interactive for CI environments
        run: eas build --platform android --profile preview --non-interactive